worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    types_hash_max_size 2048;

    # Buffer size optimizations
    client_body_buffer_size 128k;
    client_max_body_size 50M;
    proxy_buffers 16 64k;
    proxy_buffer_size 128k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml application/geo+json text/xml;

    # Upstream API cluster with connection pooling
    upstream api_cluster {
        least_conn;
        server api:8000;
        keepalive 128;
    }

    server {
        listen 80;
        server_name localhost;

        # Healthcheck pass-through
        location /health {
            proxy_pass http://api_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # System metrics
        location /metrics {
            proxy_pass http://api_cluster/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Reverse proxy to API cluster
        location / {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
